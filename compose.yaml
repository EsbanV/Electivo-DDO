services:
  web:
    image: node:24-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f1)"
        installed_hash="$$(cat node_modules/.install-hash 2>/dev/null || true)"
        if [ "$$lock_hash" != "$$installed_hash" ]; then
          npm ci || exit 1
          printf '%s\n' "$$lock_hash" > node_modules/.install-hash
        fi
        npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 150s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  node_modules:
